<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词条页与文章库 · 原型</title>
<!--
  原型：回答 #20。用完即弃。
  ?screen=entry|library  ?variant=A|B|C  ?state=normal|empty
  A 三栏（240 / 1fr / 320）  B 两栏  C 单栏 + 顶部 chips
  token 取自 docs/ui-tokens.md
-->
<style>
  :root{
    --paper:#FBFAF3;--panel:#FFFEF9;--sunken:#F8F5EC;
    --ink:#1A1A17;--ink-2:#6E6A5E;--ink-3:#A9A399;
    --amber:#8F5A1A;--amber-underline:#8A6A28;--blue:#2F5FA8;
    --bed-select:#F2E4BE;--bed-pin:#FBF2DC;--line-pin:#E3D3AE;
    --danger:#B4432A;--rule:#E6E0D0;--hover:#F3EEE1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;font-size:14px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .serif{font-family:"Source Serif 4",Sitka,Georgia,"Songti SC",serif}
  .badge{position:fixed;left:16px;bottom:18px;z-index:80;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#101114;color:#fff;font-size:13px;padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:95}
  .toast.on{opacity:1}
  .bars{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;z-index:90}
  .pbar{display:flex;align-items:center;gap:2px;padding:5px 6px;background:#101114;color:#fff;border-radius:999px;box-shadow:0 8px 26px rgba(0,0,0,.28);font-size:12.5px}
  .pbar button{height:26px;border-radius:999px;color:#cfd2d8;padding:0 9px}
  .pbar .label{padding:0 9px;white-space:nowrap}
  .pbar .label b{font-weight:600}

  .shell{display:grid;grid-template-rows:minmax(0,1fr);height:100vh;grid-template-columns:240px minmax(0,1fr)}
  .shell.A{grid-template-columns:240px minmax(0,1fr) 320px}
  .shell.C{grid-template-columns:minmax(0,1fr)}
  .pane{min-width:0;min-height:0;display:flex;flex-direction:column}
  .side{border-right:1px solid var(--rule);background:var(--sunken);display:flex;flex-direction:column;min-height:0}
  .aside{border-left:1px solid var(--rule);background:var(--sunken);overflow:auto;padding:18px 16px}
  .hd{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
  .hd .t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
  .hd .n{margin-left:auto;font-size:11px;color:var(--ink-2)}
  .search{margin:0 12px 10px;display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:5px 8px}
  .search input{flex:1;border:0;background:transparent;outline:none;font:inherit;font-size:12.5px;color:var(--ink)}
  .sorts{display:flex;gap:2px;margin:0 12px 8px;background:#EFEADC;border-radius:8px;padding:2px}
  .sorts button{flex:1;font-size:11.5px;padding:3px 0;border-radius:6px;color:var(--ink-2)}
  .sorts button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
  .list{overflow:auto;padding:0 8px 16px}
  .li{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
  .li:hover{background:var(--hover)}
  .li.on{background:var(--panel);box-shadow:0 0 0 1px var(--rule)}
  .li b{display:block;font-family:"Source Serif 4",Sitka,Georgia,serif;font-size:15.5px;font-weight:600}
  .li .m{font-size:11px;color:var(--ink-2);margin-top:1px}
  .li .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:1px}

  .main{overflow:auto;padding:22px 32px 40px;min-height:0}
  .inner{max-width:640px;margin:0 auto}
  .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
  .head h1{margin:0;font-family:"Source Serif 4",Sitka,Georgia,serif;font-size:30px;font-weight:600;line-height:1.15}
  .head .wr{font-size:11.5px;color:var(--ink-2);margin-top:6px}
  .head .act{margin-left:auto;display:flex;gap:6px}
  .btn{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:12.5px}
  .btn:hover{border-color:#CFC5AF}
  .btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn.sm{padding:4px 8px;font-size:11.5px}
  .variants{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
  .var{font-size:11.5px;color:var(--ink-2);border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:2px 9px}
  .var.on{color:var(--ink);border-color:#CFC5AF}
  .stats{font-size:12px;color:var(--ink-2);margin-bottom:22px}
  .stats b{color:var(--ink);font-weight:600}

  .grp{margin-bottom:22px}
  .grp .gh{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-2);margin-bottom:6px;border-bottom:1px solid var(--rule);padding-bottom:5px}
  .grp .gh b{font-size:12.5px;color:var(--ink);font-weight:600;font-family:"Source Serif 4",Sitka,Georgia,serif}
  .grp .gh .c{margin-left:auto}
  .sent{position:relative;padding:7px 8px 7px 0;border-radius:8px}
  .sent:hover{background:var(--hover)}
  .sent .en{font-family:"Source Serif 4",Sitka,Georgia,serif;font-size:15px;line-height:1.7}
  .sent .en mark{background:transparent;color:var(--amber);border-bottom:1.5px dashed var(--amber-underline);padding:0 1px}
  .sent .meta{font-size:11px;color:var(--ink-2);margin-top:3px}
  .sent .ops{display:none;gap:12px;margin-top:4px;font-size:11.5px;color:var(--ink-2)}
  .sent:hover .ops{display:flex}
  .sent .ops button{color:var(--ink-2)}
  .sent .ops button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

  .card{border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .card.pinned{border-color:var(--line-pin);background:var(--bed-pin)}
  .card .ch{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;color:var(--ink-2)}
  .card .ch .to{margin-left:auto;display:flex;gap:10px}
  .card .ch button{color:var(--ink-2);font-size:11px}
  .card .ct{font-size:13.5px;line-height:1.8}
  .card .src{font-size:11px;color:var(--ink-2);margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .src button{color:var(--blue);border-bottom:1px solid #CBD9EE}
  .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:0 0 8px}

  .rows{display:flex;flex-direction:column;gap:2px}
  .row{display:grid;grid-template-columns:82px minmax(0,1fr) 74px 86px;gap:10px;align-items:center;padding:9px 8px;border-radius:8px;cursor:pointer}
  .row:hover{background:var(--hover)}
  .row.on{background:var(--panel);box-shadow:0 0 0 1px var(--rule)}
  .row .date{font-size:11.5px;color:var(--ink-2)}
  .row .name{font-family:"Source Serif 4",Sitka,Georgia,serif;font-size:14.5px}
  .row .name small{display:block;font-family:"Segoe UI Variable",sans-serif;font-size:11px;color:var(--ink-2);margin-top:1px}
  .row .type{font-size:11px;color:var(--ink-2)}
  .row .prog{font-size:11px;color:var(--ink-2);text-align:right}
  .row .prog .track{height:3px;border-radius:2px;background:var(--rule);margin-top:5px;overflow:hidden}
  .row .prog .track i{display:block;height:100%;background:var(--amber)}
  .ai{font-size:10px;color:var(--blue);border:1px solid #CBD9EE;background:#EDF2FA;border-radius:999px;padding:0 6px;margin-left:6px}
  .sec{margin-bottom:26px}
  .sec .sh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
  .sec .sh .c{letter-spacing:0;text-transform:none;font-weight:400}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-2);font-size:13px;line-height:1.9}
  .empty b{display:block;font-family:"Source Serif 4",Sitka,Georgia,serif;font-size:19px;color:var(--ink);font-weight:600;margin-bottom:6px}
  .empty .btn{margin-top:14px}
  .chips{display:flex;gap:6px;padding:12px 32px;border-bottom:1px solid var(--rule);overflow:auto}
  .chip{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
  .chip.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
</style>
</head>
<body>
<div id="app"></div>
<div class="badge">原型 · 词条页与文章库</div>
<div class="toast" id="toast"></div>
<div class="bars">
  <div class="pbar"><button data-screen="entry">词条</button><button data-screen="library">文章库</button></div>
  <div class="pbar"><button id="prev">◀</button><span class="label"><b id="vkey">A</b> · <span id="vname">三栏</span></span><button id="next">▶</button></div>
</div>

<script>
const VARIANTS=[{key:"A",name:"三栏"},{key:"B",name:"两栏"},{key:"C",name:"单栏"}];
const ENTRY={
  word:"approach", variants:["approach","approached","approaching"], sentences:6, articles:3,
  groups:[
    {title:"2023 年 6 月 · 第 1 套 · 长篇匹配", count:2, items:[
      {en:"Employers are <mark>approaching</mark> hiring differently, favouring skills over degrees.", seg:"段 D · 第 3 句 · 第 4 页"},
      {en:"As the deadline <mark>approaches</mark>, the committee has yet to agree on a chair.", seg:"段 F · 第 1 句 · 第 5 页"},
    ]},
    {title:"2024 年 12 月 · 第 2 套 · 仔细阅读一", count:3, items:[
      {en:"Researchers <mark>approached</mark> the problem from two directions at once.", seg:"段 B · 第 2 句 · 第 2 页"},
      {en:"The company’s <mark>approach</mark> to training has barely changed in a decade.", seg:"段 C · 第 4 句 · 第 3 页"},
      {en:"She was cautious when a stranger <mark>approached</mark> her at the station.", seg:"段 E · 第 1 句 · 第 4 页"},
    ]},
    {title:"2025 年 6 月 · 第 3 套 · 仔细阅读二", count:1, items:[
      {en:"A measured <mark>approach</mark> tends to outlast a dramatic one.", seg:"段 A · 第 2 句 · 第 1 页"},
    ]},
  ],
  notes:[
    {pinned:true,text:"approach 作名词是“做法、路径”，作动词是“接近、着手处理”；原文里 approached 与 approach 都属于同一词条。",src:"来源：approach 线程 · 第 3 轮 · deepseek-chat · 19:05"},
    {pinned:false,text:"记法：approach = ad + prope（靠近），所以“接近”是本义，“处理、对待”是引申。",src:"来源：词条内手写，2026-11-15"},
  ],
};
const LIB={
  exam:[
    {date:"2023-06",title:"Why Gratitude Is Worth the Effort",type:"长篇匹配",words:742,prog:88,on:true},
    {date:"2023-06",title:"The Cost of Convenience",type:"仔细阅读一",words:456,prog:100},
    {date:"2023-06",title:"Rebuilding After the Flood",type:"仔细阅读二",words:438,prog:34},
    {date:"2024-12",title:"Learning to Unplug",type:"长篇匹配",words:768,prog:0},
    {date:"2024-12",title:"The Quiet Power of Routine",type:"仔细阅读一",words:441,prog:0},
  ],
  ai:[
    {title:"A Week Without Notifications",type:"AI 生成 · 6 词",words:392,prog:100,ai:true},
    {title:"Small Talk, Rehearsed",type:"AI 生成 · 4 词",words:310,prog:12,ai:true},
  ],
};
const S={sort:"recent"};
const $=(s)=>document.querySelector(s);
const qs=(k)=>new URLSearchParams(location.search).get(k);
const screen=()=>qs("screen")||"entry";
const variant=()=>qs("variant")||"A";
const isEmpty=()=>qs("state")==="empty";
function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),1800);}

/* ---------- 词条页 ---------- */
function entrySide(){
  if(isEmpty()){
    return `<aside class="side"><div class="hd"><span class="t">词条</span><span class="n">0</span></div>
      <div class="empty" style="padding:40px 18px"><b>还没有词条</b>在文章里选词、或在对话里钉住，词条才会出现。</div></aside>`;
  }
  const items=[["approach",6,3],["reciprocate",2,1],["lament",2,1],["gratitude",5,3],["sarcasm",3,2],["sustain",4,2],["trigger",2,1]];
  return `<aside class="side">
    <div class="hd"><span class="t">词条</span><span class="n">${items.length}</span></div>
    <div class="search"><input placeholder="搜词条名或原句"></div>
    <div class="sorts"><button aria-selected="${S.sort==="recent"}">最近收集</button><button aria-selected="${S.sort==="alpha"}">字母</button></div>
    <div class="list">${items.map(([w,a,b],i)=>`<div class="li ${i===0?"on":""}"><b>${w}</b><div class="m">${a} 句 · ${b} 篇${i===0?'<span class="dot"></span>':""}</div></div>`).join("")}</div>
  </aside>`;
}
function entryDetail(){
  if(isEmpty()){
    return `<div class="main"><div class="empty"><b>词条为空</b>左边选一个词条，这里显示它收集到的原句与学习内容。<div><button class="btn" data-act="toast" data-msg="去阅读">去阅读</button></div></div></div>`;
  }
  const e=ENTRY;
  return `<div class="main"><div class="inner">
    <div class="head">
      <div><h1 class="serif">${e.word}</h1><div class="wr">已收集 ${e.sentences} 句 · 来自 ${e.articles} 篇 · 最近 2026-11-15</div></div>
      <div class="act"><button class="btn" data-act="toast" data-msg="更多：合并 / 拆分 / 换主词形 / 移动学习内容">更多</button><button class="btn pri" data-act="toast" data-msg="打开学习线程">学习</button></div>
    </div>
    <div class="variants">${e.variants.map((v,i)=>`<span class="var ${i===0?"on":""}">${v}</span>`).join("")}<span class="var" data-act="toast" data-msg="更换主词形">换主词形…</span></div>
    <div class="stats"><b>${e.sentences}</b> 条原句 · <b>${e.articles}</b> 篇 · 学习内容 <b>${e.notes.length}</b> 条</div>
    ${e.groups.map(g=>`<section class="grp">
      <div class="gh"><b>${g.title}</b><span class="c">${g.count} 句</span></div>
      ${g.items.map(s=>`<div class="sent">
        <div class="en">${s.en}</div>
        <div class="meta">${s.seg}</div>
        <div class="ops"><button data-act="toast" data-msg="回到原文并高亮这句">回到原文</button><button data-act="toast" data-msg="重新圈定范围">重新圈定</button><button data-act="toast" data-msg="删除这一条原句">删除</button></div>
      </div>`).join("")}
    </section>`).join("")}
    ${variant()==="B"||variant()==="C"?notesBlock():""}
  </div></div>`;
}
function notesBlock(){
  return `<section style="margin-top:26px">
    <div class="lbl">学习内容</div>
    ${ENTRY.notes.map(n=>`<div class="card ${n.pinned?"pinned":""}">
      <div class="ch"><span>${n.pinned?"已置顶":"学习内容"}</span><div class="to">${n.pinned?"":'<button data-act="toast" data-msg="已置顶">置顶</button>'}<button data-act="toast" data-msg="就地编辑，保存后按 Markdown 渲染">编辑</button><button data-act="toast" data-msg="移到别的词条">移动</button><button data-act="toast" data-msg="删除这条学习内容">删除</button></div></div>
      <div class="ct">${n.text}</div>
      <div class="src">${n.src}<button data-act="toast" data-msg="回到那条对话并高亮">看原对话</button></div>
    </div>`).join("")}
  </section>`;
}
function entryAside(){
  return `<aside class="aside">
    <div class="lbl">主词形</div>
    <div class="variants" style="margin:0 0 18px">${ENTRY.variants.map((v,i)=>`<span class="var ${i===0?"on":""}">${v}</span>`).join("")}</div>
    <div class="lbl">学习内容</div>
    ${ENTRY.notes.map(n=>`<div class="card ${n.pinned?"pinned":""}">
      <div class="ch"><span>${n.pinned?"已置顶":"学习内容"}</span><div class="to"><button data-act="toast" data-msg="编辑">编辑</button></div></div>
      <div class="ct">${n.text}</div>
      <div class="src">${n.src}</div>
    </div>`).join("")}
    <div class="lbl" style="margin-top:20px">更多</div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">
      <button class="btn sm" data-act="toast" data-msg="合并到另一个词条">合并词条</button>
      <button class="btn sm" data-act="toast" data-msg="把这条原句拆到新词条">拆分原句</button>
      <button class="btn sm" data-act="toast" data-msg="更换主词形">换主词形</button>
      <button class="btn sm" data-act="toast" data-msg="移动学习内容到另一词条">移动学习内容</button>
    </div>
  </aside>`;
}
/* ---------- 文章库 ---------- */
function libSide(){
  return `<aside class="side">
    <div class="hd"><span class="t">文章库</span><span class="n">63 + 2</span></div>
    <div class="search"><input placeholder="搜篇名或正文"></div>
    <div class="list">
      ${[["真题","63 篇 · 7 个场次"],["AI 生成","2 篇"],["最近打开","6 篇"]].map(([t,m],i)=>`<div class="li ${i===0?"on":""}"><b style="font-family:inherit;font-size:13px">${t}</b><div class="m">${m}</div></div>`).join("")}
      <div class="hd" style="padding:14px 10px 6px"><span class="t">场次</span></div>
      ${["2025 年 12 月","2025 年 6 月","2024 年 12 月","2024 年 6 月"].map(d=>`<div class="li" style="padding:6px 10px"><b style="font-family:inherit;font-size:12.5px;font-weight:400">${d}</b><div class="m">9 篇</div></div>`).join("")}
    </div>
  </aside>`;
}
function libRows(){
  return LIB.exam.map(r=>`<div class="row ${r.on?"on":""}">
    <span class="date">${r.date}</span>
    <span class="name">${r.title}<small>${r.type} · ${r.words} 词</small></span>
    <span class="type">${r.prog===100?"已读完":r.prog>0?"读到一半":"未读"}</span>
    <span class="prog">${r.prog}%</span>
  </div>`).join("");
}
function libDetail(){
  const r=LIB.exam[0];
  return `<aside class="aside">
    <div class="lbl">这篇</div>
    <div class="serif" style="font-size:17px;line-height:1.4;margin-bottom:6px">${r.title}</div>
    <div style="font-size:11.5px;color:var(--ink-2);line-height:1.8">2023 年 6 月 · 第 1 套 · 长篇匹配<br>${r.words} 词 · 读到 88%<br>收词 2 条 · 最近 2026-11-15</div>
    <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
      <button class="btn sm pri" data-act="toast" data-msg="继续阅读">继续阅读</button>
      <button class="btn sm" data-act="toast" data-msg="重命名">重命名</button>
      <button class="btn sm" data-act="toast" data-msg="删除前会确认">删除</button>
    </div>
    <div class="lbl" style="margin-top:22px">本篇收过</div>
    <div class="card" style="padding:9px 11px"><div class="ct" style="font-size:12.5px"><mark style="background:transparent;color:var(--amber);border-bottom:1.5px dashed var(--amber-underline)">approaching</mark> · 2 句</div></div>
    <div class="card" style="padding:9px 11px"><div class="ct" style="font-size:12.5px"><mark style="background:transparent;color:var(--amber);border-bottom:1.5px dashed var(--amber-underline)">lament</mark> · 2 句</div></div>
  </aside>`;
}
function libraryMain(){
  if(isEmpty()){
    return `<div class="main"><div class="empty"><b>还没有生成文章</b>用一组词生成，或者把对话里的一段存为文章，都会出现在这儿。<div><button class="btn" data-act="toast" data-msg="用一组词生成">用一组词生成</button></div></div></div>`;
  }
  return `<div class="main"><div class="inner" style="max-width:720px">
    <div class="sec">
      <div class="sh"><span>真题</span><span class="c">63 篇 · 7 个场次</span><span style="margin-left:auto;color:var(--ink-2);text-transform:none;letter-spacing:0;font-weight:400">按场次分组 · 组内按阅读进度</span></div>
      <div class="rows">${libRows()}</div>
    </div>
    <div class="sec">
      <div class="sh"><span>AI 生成</span><span class="c">${LIB.ai.length} 篇</span></div>
      <div class="rows">${LIB.ai.map(r=>`<div class="row">
        <span class="date">本周</span>
        <span class="name">${r.title}<span class="ai">AI</span><small>${r.type} · ${r.words} 词</small></span>
        <span class="type">${r.prog===100?"已读完":"读到一半"}</span>
        <span class="prog">${r.prog}%</span>
      </div>`).join("")}</div>
    </div>
  </div></div>`;
}
function libChips(){
  return `<div class="chips"><span class="chip on">全部</span><span class="chip">真题</span><span class="chip">AI 生成</span><span class="chip">最近打开</span></div>`;
}

function render(){
  const v=variant(),sc=screen();
  if(qs("chrome")==="0")document.querySelectorAll(".badge,.bars").forEach(el=>el.style.display="none");
  $("#vkey").textContent=v;$("#vname").textContent=(VARIANTS.find(x=>x.key===v)||VARIANTS[0]).name;
  if(sc==="entry"){
    if(v==="A")$("#app").innerHTML=`<div class="shell A">${entrySide()}${entryDetail()}${isEmpty()?"":entryAside()}</div>`;
    else if(v==="B")$("#app").innerHTML=`<div class="shell">${entrySide()}${entryDetail()}</div>`;
    else $("#app").innerHTML=`<div class="shell C"><div class="pane">
      <div class="chips"><span class="chip on">approach</span><span class="chip">reciprocate</span><span class="chip">lament</span><span class="chip">gratitude</span><span class="chip">+4</span></div>
      ${entryDetail()}</div></div>`;
  }else{
    if(v==="A")$("#app").innerHTML=`<div class="shell A">${libSide()}${libraryMain()}${isEmpty()?"":libDetail()}</div>`;
    else if(v==="B")$("#app").innerHTML=`<div class="shell">${libSide()}${libraryMain()}</div>`;
    else $("#app").innerHTML=`<div class="shell C"><div class="pane">${libChips()}${libraryMain()}</div></div>`;
  }
  bind();
}
function bind(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    if(el._b)return;el._b=true;
    el.addEventListener("click",()=>toast(el.dataset.msg||""));
  });
  document.querySelectorAll(".sorts button").forEach(b=>b.onclick=()=>{S.sort=b.textContent.includes("字母")?"alpha":"recent";render();});
  document.querySelectorAll("[data-screen]").forEach(b=>b.onclick=()=>{const u=new URL(location.href);u.searchParams.set("screen",b.dataset.screen);location.href=u;});
}
function go(n){const i=VARIANTS.findIndex(x=>x.key===variant());const v=VARIANTS[(i+n+3)%3];const u=new URL(location.href);u.searchParams.set("variant",v.key);location.href=u;}
$("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);
render();
</script>
</body>
</html>
