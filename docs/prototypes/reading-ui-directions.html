<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读界面视觉方向 · 原型</title>
<!--
  原型：回答“阅读界面应该长什么样”。
  四个结构不同的方向，用 ?variant=A|B|C|D 切换，底部浮条或 ←/→ 键轮换。
  只读原型：不读写真实数据，刷新即还原。用完即弃。
  A 书页     — 无边框、居中单栏、段落字母在页边，工具按需出现
  B 工作台   — 三栏：文章库 / 正文纸页 / 常驻检查器
  C 夜读     — 深色、页边注、底部抽屉
  D 素读     — 浅色纸、页边注、专注模式、两级词状态（依据 docs/research/reading-ui-primary-sources.md）
  词状态：颜色为主（琥珀=已收集、蓝=稍后看、麦底=选中），线型只作辅助；产品已确认用颜色。
-->
<style>
  :root { --size: 19px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .bar-switch {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px; padding: 5px 6px;
    background: #101114; color: #fff; border-radius: 999px;
    box-shadow: 0 8px 26px rgba(0,0,0,.28); z-index: 90;
    font-size: 12.5px; letter-spacing: .02em;
  }
  .bar-switch button { width: 30px; height: 28px; border-radius: 999px; color: #cfd2d8; }
  .bar-switch button:hover { background: #24262c; color: #fff; }
  .bar-switch .label { padding: 0 10px; white-space: nowrap; color: #f2f3f5; }
  .bar-switch .label b { font-weight: 600; }
  .badge {
    position: fixed; left: 16px; bottom: 18px; z-index: 80;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 4px;
    background: rgba(0,0,0,.55); color: #fff;
  }
  .toast {
    position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%);
    background: #101114; color: #fff; font-size: 13px; padding: 8px 14px;
    border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .18s;
    z-index: 95;
  }
  .toast.on { opacity: 1; }

  /* ---------------- A · 书页 ---------------- */
  body[data-variant="A"] { --bg:#F6F2E9; --panel:#FBF8F1; --ink:#24211B; --muted:#6B665C; --rule:#E3DAC8; --accent:#3F6B53; --hl:#F3E2B0; --collected:#EDE4CB; background: var(--bg); color: var(--ink); }
  body[data-variant="A"] .a-bar { display:flex; align-items:center; justify-content:space-between; padding: 18px 28px; }
  body[data-variant="A"] .a-crumb { font-size: 12.5px; letter-spacing:.04em; color: var(--muted); }
  body[data-variant="A"] .a-tools { display:flex; gap: 4px; }
  body[data-variant="A"] .a-tools button { padding: 6px 10px; font-size: 12.5px; color: var(--muted); border-radius: 5px; }
  body[data-variant="A"] .a-tools button:hover { background: rgba(0,0,0,.045); color: var(--ink); }
  body[data-variant="A"] .a-page { max-width: 620px; margin: 0 auto; padding: 26px 24px 150px; }
  body[data-variant="A"] .a-meta { font-size: 12.5px; color: var(--muted); margin-bottom: 26px; letter-spacing:.03em; }
  body[data-variant="A"] .a-body p {
    font-family: "Source Serif 4", Sitka, Georgia, "Songti SC", serif;
    font-size: var(--size); line-height: 1.7; margin: 0 0 1.05em; position: relative;
    text-wrap: pretty;
  }
  body[data-variant="A"] .a-letter {
    position:absolute; left:-2.6rem; top:.28em; font-family: "Segoe UI", sans-serif;
    font-size: 11.5px; letter-spacing:.12em; color: var(--muted);
  }
  body[data-variant="A"] .a-foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--rule); display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--muted); }
  body[data-variant="A"] .a-foot button { padding: 8px 14px; border:1px solid var(--rule); border-radius: 6px; color: var(--ink); }
  body[data-variant="A"] .a-drawer {
    position: fixed; top:0; right:0; bottom:0; width: min(430px, 92vw); background: var(--panel);
    border-left:1px solid var(--rule); transform: translateX(102%); transition: transform .22s ease;
    padding: 22px 24px 90px; overflow:auto; z-index: 70;
  }
  body[data-variant="A"] .a-drawer[data-open="true"] { transform: translateX(0); }
  body[data-variant="A"] .gloss { font-size: .64em; color: var(--muted); vertical-align: .35em; margin-left:.15em; font-family:"Microsoft YaHei UI",sans-serif; }
  body[data-variant="A"] .collected { color:#8F5A1A; border-bottom:1px dotted currentColor; cursor:pointer; }
  body[data-variant="A"] .collected:hover { background:#F3EAD2; }
  body[data-variant="A"] .later { color:#2B5A9E; border-bottom:1px solid currentColor; cursor:pointer; }
  body[data-variant="A"] .selected { background: var(--hl); border-radius: 2px; }
  body[data-variant="A"] .take { display:inline-block; margin-left:6px; vertical-align:.1em; font-family:"Segoe UI",sans-serif; font-size: 11px; letter-spacing:.02em; color: var(--accent); border:1px solid currentColor; border-radius: 4px; padding: 1px 5px; cursor:pointer; }

  /* ---------------- B · 工作台 ---------------- */
  body[data-variant="B"] { --bg:#EDEFF3; --panel:#FFFFFF; --ink:#1D2129; --muted:#5B6068; --rule:#E1E5EC; --accent:#1F5AC0; --hl:#DCE8FF; --collected:#EDF3FE; background: var(--bg); color: var(--ink); }
  body[data-variant="B"] .b-shell { display:grid; grid-template-columns: 232px minmax(0,1fr) 372px; height: 100vh; }
  body[data-variant="B"] .b-rail { border-right:1px solid var(--rule); background:#F7F8FA; padding:16px 12px; overflow:auto; }
  body[data-variant="B"] .b-rail h3 { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin: 6px 8px 10px; font-weight:600; }
  body[data-variant="B"] .b-set { font-size:12px; color:var(--muted); margin: 14px 8px 6px; letter-spacing:.02em; }
  body[data-variant="B"] .b-item { padding:8px 10px; border-radius:6px; display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer; }
  body[data-variant="B"] .b-item:hover { background:#EDF0F5; }
  body[data-variant="B"] .b-item[data-current="true"] { background:#fff; box-shadow:0 0 0 1px var(--rule); }
  body[data-variant="B"] .b-item .t { font-size:13px; }
  body[data-variant="B"] .b-item .n { font-size:11px; color:var(--muted); }
  body[data-variant="B"] .b-main { display:flex; flex-direction:column; min-width:0; }
  body[data-variant="B"] .b-toolbar { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid var(--rule); background:#fff; }
  body[data-variant="B"] .b-toolbar .grp { display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted); }
  body[data-variant="B"] .b-toolbar button { padding:5px 9px; border:1px solid var(--rule); border-radius:6px; background:#fff; font-size:12px; color:var(--ink); }
  body[data-variant="B"] .b-toolbar button:hover { background:#F3F5F8; }
  body[data-variant="B"] .b-canvas { overflow:auto; padding: 26px 30px 120px; }
  body[data-variant="B"] .b-sheet { max-width: 620px; margin:0 auto; background:#fff; border:1px solid var(--rule); border-radius:10px; padding: 40px 46px 48px; }
  body[data-variant="B"] .b-sheet .meta { font-size:12px; color:var(--muted); margin-bottom:22px; }
  body[data-variant="B"] .b-sheet p { font-family: "Segoe UI", system-ui, "Microsoft YaHei UI", sans-serif; font-size: var(--size); line-height:1.65; margin:0 0 .85em; }
  body[data-variant="B"] .b-letter { display:inline-block; width:1.7em; margin-left:-1.7em; font-size:12px; color:var(--muted); vertical-align:.2em; }
  body[data-variant="B"] .b-inspector { border-left:1px solid var(--rule); background:#fff; display:flex; flex-direction:column; min-width:0; }
  body[data-variant="B"] .b-tabs { display:flex; gap:2px; padding:10px 12px 0; border-bottom:1px solid var(--rule); }
  body[data-variant="B"] .b-tabs button { padding:8px 12px; font-size:12.5px; color:var(--muted); border-bottom:2px solid transparent; }
  body[data-variant="B"] .b-tabs button[aria-selected="true"] { color:var(--ink); border-color: var(--accent); }
  body[data-variant="B"] .b-panel { padding:18px; overflow:auto; }
  body[data-variant="B"] .gloss { font-size:.66em; color:var(--muted); vertical-align:.32em; margin-left:.15em; }
  body[data-variant="B"] .collected { color:#8F5A1A; border-bottom:1px dotted currentColor; cursor:pointer; }
  body[data-variant="B"] .collected:hover { background:#FBF3E3; }
  body[data-variant="B"] .later { color:#1F5AC0; border-bottom:1px solid currentColor; cursor:pointer; }
  body[data-variant="B"] .selected { background: var(--hl); border-radius:3px; }
  body[data-variant="B"] .take { font-size:11px; color:var(--accent); border:1px solid currentColor; border-radius:4px; padding:0 4px; margin-left:4px; cursor:pointer; }

  /* ---------------- C · 夜读 ---------------- */
  body[data-variant="C"] { --bg:#14151A; --panel:#1C1E25; --ink:#E9E4D8; --muted:#9A9488; --rule:#2A2C34; --accent:#D9A441; --hl:#3B3323; --collected:#26262E; background: var(--bg); color: var(--ink); }
  body[data-variant="C"] .c-bar { display:flex; align-items:center; justify-content:space-between; padding: 20px 34px; border-bottom:1px solid var(--rule); }
  body[data-variant="C"] .c-crumb { font-size:12px; color:var(--muted); letter-spacing:.04em; }
  body[data-variant="C"] .c-tools { display:flex; gap:14px; font-size:12px; color:var(--muted); }
  body[data-variant="C"] .c-tools button { color:var(--muted); }
  body[data-variant="C"] .c-tools button:hover { color: var(--ink); }
  body[data-variant="C"] .c-grid { display:grid; grid-template-columns: minmax(0, 620px) 260px; gap: 64px; justify-content:center; padding: 44px 32px 180px; }
  body[data-variant="C"] .c-col p { font-family: "Source Serif 4", Sitka, Georgia, serif; font-size: var(--size); line-height:1.7; margin:0 0 1.2em; position:relative; }
  body[data-variant="C"] .c-col p.lead::first-letter { float:left; font-size:4.1em; line-height:.82; padding:.06em .1em 0 0; color: var(--accent); }
  body[data-variant="C"] .c-letter { position:absolute; left:-2.6rem; top:.5em; font-family:"Segoe UI",sans-serif; font-size:12px; letter-spacing:.14em; color:var(--muted); }
  body[data-variant="C"] .c-notes { padding-top: 4px; }
  body[data-variant="C"] .c-note { font-size:12.5px; line-height:1.6; color:var(--muted); border-left:2px solid var(--rule); padding: 2px 0 2px 12px; margin-bottom: 26px; }
  body[data-variant="C"] .c-note b { color: var(--ink); font-weight:600; }
  body[data-variant="C"] .gloss { display:none; }
  body[data-variant="C"] .collected { color:#D9A441; border-bottom:1px dotted currentColor; cursor:pointer; }
  body[data-variant="C"] .later { color:#7FB2E5; border-bottom:1px solid currentColor; cursor:pointer; }
  body[data-variant="C"] .selected { background: var(--hl); }
  body[data-variant="C"] .take { color:var(--accent); font-size:11px; margin-left:6px; border-bottom:1px solid currentColor; cursor:pointer; }
  body[data-variant="C"] .c-sheet {
    position: fixed; left:50%; bottom:78px; transform: translateX(-50%);
    width: min(780px, 94vw); background: var(--panel); border:1px solid var(--rule); border-bottom:0;
    border-radius: 14px 14px 0 0; z-index: 60; box-shadow: 0 -18px 50px rgba(0,0,0,.35);
    max-height: 54px; overflow: hidden; transition: max-height .22s ease;
  }
  body[data-variant="C"] .c-sheet[data-open="true"] { max-height: 64vh; border-radius: 14px; border-bottom: 1px solid var(--rule); }
  body[data-variant="C"] .c-sheet-head { height:54px; display:flex; align-items:center; gap:8px; padding: 0 18px; border-bottom:1px solid var(--rule); }
  body[data-variant="C"] .c-sheet-head button { font-size:12.5px; color:var(--muted); padding: 6px 10px; border-radius:6px; }
  body[data-variant="C"] .c-sheet-head button[aria-selected="true"] { color:var(--ink); background: #262831; }
  body[data-variant="C"] .c-sheet-head .grip { width:34px; height:4px; border-radius:2px; background:#3A3D47; margin-right:6px; }
  body[data-variant="C"] .c-sheet-body { padding: 18px 20px 26px; max-height: 52vh; overflow:auto; }

  /* ---------------- D · 素读 ---------------- */
  body[data-variant="D"] { --bg:#FBFAF3; --panel:#FFFEF9; --ink:#1A1A17; --muted:#6E6A5E; --rule:#E6E0D0; --accent:#6E4B2E; --hl:#F2E4BE; --collected:#8A6A45; background: var(--bg); color: var(--ink); }
  body[data-variant="D"] .d-bar { display:flex; justify-content:space-between; align-items:center; padding:20px 30px; }
  body[data-variant="D"] .d-crumb { font-size:12px; letter-spacing:.06em; color:var(--muted); }
  body[data-variant="D"] .d-tools { display:flex; gap:2px; align-items:center; }
  body[data-variant="D"] .d-tools button { font-size:12px; color:var(--muted); padding:6px 9px; border-radius:5px; }
  body[data-variant="D"] .d-tools button:hover, body[data-variant="D"] .d-tools button[aria-pressed="true"] { background: rgba(0,0,0,.05); color: var(--ink); }
  body[data-variant="D"] .d-page { padding: 18px 24px 140px; }
  body[data-variant="D"] .d-meta { max-width: 920px; margin: 0 auto 28px; font-size:12px; color:var(--muted); }
  body[data-variant="D"] .d-grid { display:grid; grid-template-columns: minmax(0,620px) 200px; gap:44px; justify-content:center; }
  body[data-variant="D"] .d-body p { position:relative; font-family: "Source Serif 4", Sitka, Georgia, serif;
    font-size: var(--size); line-height:1.62; margin:0 0 1.15em; text-wrap: pretty; transition: opacity .25s; }
  body[data-variant="D"] .d-letter { position:absolute; left:-2.4rem; top:.4em; font-family:"Segoe UI",sans-serif;
    font-size:12px; letter-spacing:.16em; color:var(--muted); }
  body[data-variant="D"] .d-page.d-focus .d-body p { opacity:.24; }
  body[data-variant="D"] .d-page.d-focus .d-body p.is-current { opacity:1; }
  body[data-variant="D"] .d-body .gloss { display:none; }
  body[data-variant="D"] .d-body .collected { color:#8F5A1A; border-bottom:1px dotted currentColor; cursor:pointer; }
  body[data-variant="D"] .d-body .collected:hover { background:#F4EDD9; }
  body[data-variant="D"] .d-body .later { color:#2F5FA8; border-bottom:1px solid currentColor; cursor:pointer; }
  body[data-variant="D"] .d-body .selected { background: var(--hl); }
  body[data-variant="D"] .d-body .take { font-size:10.5px; color:var(--accent); border:1px solid currentColor; border-radius:3px; padding:0 4px; margin-left:5px; cursor:pointer; }
  body[data-variant="D"] .d-notes { padding-top:.4em; }
  body[data-variant="D"] .d-legend { margin-left:14px; }
  body[data-variant="D"] .d-legend b { font-weight:600; }
  body[data-variant="D"] .d-note { font-size:12px; line-height:1.6; color:var(--muted); border-top:1px solid var(--rule); padding:9px 0 0; margin-bottom:20px; }
  body[data-variant="D"] .d-note .lbl { display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:3px; }
  body[data-variant="D"] .d-note b { display:block; font-family:Georgia,serif; font-size:14px; color:var(--ink); font-weight:600; }
  body[data-variant="D"] .d-foot { max-width:920px; margin:44px auto 0; padding-top:16px; border-top:1px solid var(--rule); display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); }
  body[data-variant="D"] .d-foot button { border:1px solid var(--rule); padding:8px 14px; border-radius:6px; color:var(--ink); }
  body[data-variant="D"] .d-drawer { position:fixed; top:0; right:0; bottom:0; width:min(400px,92vw); background:var(--panel);
    border-left:1px solid var(--rule); transform:translateX(102%); transition:transform .22s ease;
    padding:22px 24px 90px; overflow:auto; z-index:70; }
  body[data-variant="D"] .d-drawer[data-open="true"] { transform:none; }
  @media (max-width: 1000px) {
    body[data-variant="D"] .d-grid { grid-template-columns: minmax(0, 620px); }
    body[data-variant="D"] .d-notes { display: none; }
    body[data-variant="D"] .d-body .gloss { display: inline; }
  }

  /* ---------------- 共用内容块 ---------------- */
  .card-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .card-head .w { font-size:26px; font-weight:600; letter-spacing:-.01em; }
  .card-head .c { font-size:12px; color:var(--muted); }
  .forms { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 18px; }
  .forms span { font-size:11.5px; padding:2px 7px; border-radius:999px; border:1px solid currentColor; opacity:.55; }
  .forms span.on { opacity:1; font-weight:600; }
  .sec { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin: 20px 0 8px; font-weight:600; }
  .quote { border-left:2px solid currentColor; padding-left:12px; margin: 0 0 12px; font-size:13.5px; line-height:1.65; opacity:.92; }
  .quote .src { display:block; font-size:11.5px; opacity:.55; margin-top:4px; }
  .note-item { font-size:13px; line-height:1.65; padding:10px 12px; border:1px solid var(--rule); border-radius:8px; margin-bottom:8px; }
  .ctx { display:flex; flex-wrap:wrap; gap:6px; margin: 10px 0 16px; }
  .ctx span { font-size:11.5px; padding:3px 8px; border-radius:999px; border:1px solid var(--rule); }
  .ctx span.on { border-color: currentColor; font-weight:600; }
  .instr { width:100%; border:1px solid var(--rule); border-radius:8px; padding:10px 12px; font:inherit; font-size:13px; line-height:1.6; background:transparent; color:inherit; resize:vertical; min-height:64px; }
  .result { font-size:13.5px; line-height:1.7; margin-top:14px; }
  .ver { display:flex; gap:6px; margin: 10px 0 4px; }
  .ver button { font-size:11.5px; padding:2px 8px; border:1px solid var(--rule); border-radius:999px; }
  .ver button[aria-selected="true"] { border-color: currentColor; font-weight:600; }
  .pdfmock { border:1px solid var(--rule); border-radius:6px; background:#fff; color:#333; padding:18px 16px; font-family: Georgia, serif; font-size:11px; line-height:1.55; }
  .pdfmock .pg { font-size:10px; color:#888; margin-bottom:8px; }
  .pdfmock mark { background:#FFE9A8; }
  .kv { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); padding:6px 0; border-bottom:1px dashed var(--rule); }
  .btn-row { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .btn-row button { font-size:12.5px; padding:7px 12px; border-radius:6px; border:1px solid currentColor; }
  .btn-row button.primary { background: currentColor; }
  .btn-row button.primary span { mix-blend-mode: difference; color:#fff; }
</style>
</head>
<body data-variant="A">
<div id="app"></div>
<div class="badge">原型 · 视觉方向</div>
<div class="toast" id="toast"></div>
<div class="bar-switch" id="switch">
  <button id="prev" aria-label="上一个方向">◀</button>
  <span class="label"><b id="vkey">A</b> · <span id="vname">书页</span></span>
  <button id="next" aria-label="下一个方向">▶</button>
</div>

<script>
const VARIANTS = [
  { key: "A", name: "书页" },
  { key: "B", name: "工作台" },
  { key: "C", name: "夜读" },
  { key: "D", name: "素读" },
];

const DATA = {
  article: {
    label: "2023 年 6 月 · 第 1 套 · 长篇匹配",
    meta: "1,183 词 · 13 段 · 长篇匹配",
    paragraphs: [
      { id: "A", text: "Gratitude may be more beneficial than we commonly suppose. One recent study asked participants to write a note of thanks to someone and then estimate how surprised and happy the recipient would feel — an impact that they consistently underestimated. Another study assessed the health benefits of writing thank-you notes. The researchers found that writing as few as three weekly thank-you notes over the course of three weeks improved life satisfaction, increased happy feelings and reduced symptoms of depression." },
      { id: "B", text: "While this research into gratitude is relatively new, the principles involved are anything but. Students of mine in a political philosophy course at Indiana University are reading Daniel Defoe’s 300-year-old Robinson Crusoe, often regarded as the first novel published in English. Left alone on an unknown island with no apparent prospect of rescue or escape, Crusoe has much to lament. But instead of giving in to despair, he makes a list of things for which he is grateful, including the fact that he is the sole survivor from the shipwreck and has been able to salvage many useful items from the wreckage." },
      { id: "C", text: "Defoe’s masterpiece, which is often ranked as one of the world’s greatest novels, provides a portrait of gratitude in action that is as timely and relevant today as it has ever been. It is also one with which contemporary psychology and medicine are just beginning to catch up. Simply put, for most of us, it is far more helpful to focus on the things in life for which we can express gratitude than those that incline us toward resentment and lamentation." },
    ],
  },
  glosses: { lament: "悲叹", shipwreck: "海难" },
  collected: ["gratitude", "lament", "shipwreck"],
  later: ["despair"],
  selection: "write a note of thanks",
  entries: {
    lament: {
      word: "lament",
      forms: [["lament", true], ["laments", false], ["lamented", false], ["lamentation", false]],
      counts: "2 句 · 1 篇",
      quotes: [

const $ = (sel) => document.querySelector(sel);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 1600);
}

function rangesFor(text) {
  const out = [];
  for (const [w, g] of Object.entries(DATA.glosses)) {
    const i = text.indexOf(w);
    if (i >= 0) out.push({ start: i, end: i + w.length, type: "gloss", word: w, gloss: g });
  }
  for (const w of DATA.later) {
    const re = new RegExp("\\b" + w + "\\b", "gi");
    let m;
    while ((m = re.exec(text))) out.push({ start: m.index, end: m.index + w.length, type: "later", word: w });
  }
  for (const w of DATA.collected) {
    const re = new RegExp("\\b" + w + "\\b", "gi");
    let m;
    while ((m = re.exec(text))) out.push({ start: m.index, end: m.index + w.length, type: "collected", word: w });
  }
  const si = text.indexOf(DATA.selection);
  if (si >= 0) out.push({ start: si, end: si + DATA.selection.length, type: "selected", word: DATA.selection });
  out.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const merged = [];
  let last = -1;
  for (const r of out) {
    if (r.start >= last) { merged.push(r); last = r.end; }
  }
  return merged;
}

function markup(text) {
  const ranges = rangesFor(text);
  let html = "", cur = 0;
  for (const r of ranges) {
    html += esc(text.slice(cur, r.start));
    const inner = esc(text.slice(r.start, r.end));
    if (r.type === "gloss") {
      html += `<span class="collected" data-word="${r.word}">${inner}</span><span class="gloss">（${r.gloss}）</span>`;
    } else if (r.type === "collected") {
      html += `<span class="collected" data-word="${r.word}">${inner}</span>`;
    } else if (r.type === "later") {
      html += `<span class="later" data-word="${r.word}">${inner}</span>`;
    } else {
      html += `<span class="selected">${inner}</span><span class="take" data-take="1">收下</span>`;
    }
    cur = r.end;
  }
  html += esc(text.slice(cur));
  return html;
}

/* ---------------- 交互 ---------------- */
function setSheet(open) {
  const s = document.getElementById("sheet");
  if (!s) return;
  s.dataset.open = open ? "true" : "false";
  const b = s.querySelector('[data-act="togglesheet"]');
  if (b) b.textContent = open ? "收起" : "展开";
}

function openEntry(word, mode) {
  if (mode === "A" || mode === "D") {
    $("#drawer-body").innerHTML = entryHTML(word);
    $("#drawer").dataset.open = "true";
  } else if (mode === "B") {
    $("#b-panel").innerHTML = entryHTML(word);
    document.querySelectorAll(".b-tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === "entry"));
  } else if (mode === "C") {
    $("#c-body").innerHTML = entryHTML(word);
    setSheet(true);
    document.querySelectorAll(".c-sheet-head button[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === "entry"));
  }
}

function wire(variant) {
  document.body.dataset.variant = variant;
  document.querySelectorAll("[data-word]").forEach((el) => {
    el.addEventListener("click", () => openEntry(el.dataset.word, variant));
  });
  document.querySelectorAll("[data-take]").forEach((el) => {
    el.addEventListener("click", (e) => { e.stopPropagation(); toast("已收下这条原句（原型，不保存）"); });
  });
  document.querySelectorAll("[data-act]").forEach((el) => {
    el.addEventListener("click", () => {
      const act = el.dataset.act;
      if (act === "font+") setSize(1);
      else if (act === "font-") setSize(-1);
      else if (act === "focus") {
        const page = document.querySelector(".d-page");
        if (page) {
          page.classList.toggle("d-focus");
          el.setAttribute("aria-pressed", String(page.classList.contains("d-focus")));
        }
      }
      else if (act === "pdf") showPdf(variant);
      else if (act === "entry") openEntry("lament", variant);
      else if (act === "study") showStudy(variant);
      else if (act === "open") showTab(el.dataset.tab, variant);
      else if (act === "togglesheet") setSheet(document.getElementById("sheet").dataset.open !== "true");
      else if (act === "closedraw") { const d = $("#drawer"); if (d) d.dataset.open = "false"; }
    });
  });
  document.querySelectorAll("[data-tab]").forEach((el) => {
    el.addEventListener("click", () => showTab(el.dataset.tab, variant));
  });
}

function showPdf(variant) {
  if (variant === "A" || variant === "D") { $("#drawer-body").innerHTML = pdfHTML(); $("#drawer").dataset.open = "true"; }
  else if (variant === "B") { $("#b-panel").innerHTML = pdfHTML(); document.querySelectorAll(".b-tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === "pdf")); }
  else { $("#c-body").innerHTML = pdfHTML(); setSheet(true); document.querySelectorAll(".c-sheet-head button[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === "pdf")); }
}

function showStudy(variant) {
  if (variant === "A" || variant === "D") { $("#drawer-body").innerHTML = studyHTML(); $("#drawer").dataset.open = "true"; }
  else if (variant === "B") { $("#b-panel").innerHTML = studyHTML(); document.querySelectorAll(".b-tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === "study")); }
  else { $("#c-body").innerHTML = studyHTML(); setSheet(true); document.querySelectorAll(".c-sheet-head button[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === "study")); }
}

function showTab(tab, variant) {
  if (tab === "entry") openEntry("lament", variant);
  else if (tab === "study") showStudy(variant);
  else if (tab === "pdf") showPdf(variant);
}

let size = 19;
function setSize(d) {
  size = Math.min(23, Math.max(16, size + d));
  document.documentElement.style.setProperty("--size", size + "px");
}

/* ---------------- 切换 ---------------- */
function currentVariant() {
  const q = new URLSearchParams(location.search).get("variant");
  return VARIANTS.some((v) => v.key === q) ? q : "A";
}
function render() {
  const key = currentVariant();
  const v = VARIANTS.find((x) => x.key === key);
  $("#vkey").textContent = v.key;
  $("#vname").textContent = v.name;
  if (key === "A") renderA();
  if (key === "B") renderB();
  if (key === "C") renderC();
  if (key === "D") renderD();
  wire(key);
  document.title = `阅读界面 · ${v.key} ${v.name}`;
}
function go(dir) {
  const i = VARIANTS.findIndex((v) => v.key === currentVariant());
  const n = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length];
  const url = new URL(location.href);
  url.searchParams.set("variant", n.key);
  history.replaceState(null, "", url);
  render();
}
$("#prev").addEventListener("click", () => go(-1));
$("#next").addEventListener("click", () => go(1));
document.addEventListener("keydown", (e) => {
  const t = document.activeElement;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
document.addEventListener("click", (e) => {
  if (document.body.dataset.variant !== "A") return;
  if (e.target.closest(".a-drawer, [data-act], [data-word], .bar-switch")) return;
  const d = $("#drawer");
  if (d) d.dataset.open = "false";
});
render();
if (new URLSearchParams(location.search).get("open")) openEntry("lament", currentVariant());
